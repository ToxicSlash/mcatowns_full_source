plugins {
    id 'fabric-loom' version '1.8.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
    maven { url = 'https://maven.architectury.dev/' }
    // TODO: add CurseMaven/Modrinth/local Maven entries for MCA Reborn, Guard Villagers, and Villager Business if you want direct dev deps
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.136"
    modImplementation "com.terraformersmc:modmenu:7.2.2"
    modRuntimeOnly "dev.architectury:architectury-fabric:9.2.14"
    modRuntimeOnly files("libs/minecraft-comes-alive-7.6.15+1.20.1-universal.jar")

    // Optional dev dependencies:
    // modImplementation "curse.maven:minecraft-comes-alive-reborn-535291:<file-id>"
    // modImplementation "curse.maven:guard-villagers-360203:<file-id>"
    // modImplementation files("libs/villager-business.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
