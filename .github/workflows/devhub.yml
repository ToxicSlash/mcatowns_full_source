          if not errorlevel 1 (
            py -3 -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          where python >nul 2>&1
          if not errorlevel 1 (
            python -c "import sys; print(sys.executable)" > python-path.txt 2>nul
            if not errorlevel 1 goto found_python
          )
          for %%P in ("%LOCALAPPDATA%\Python\pythoncore-3.15-64\python.exe" "%LOCALAPPDATA%\Programs\Python\Python315\python.exe" "%LOCALAPPDATA%\Programs\Python\Python314\python.exe" "%LOCALAPPDATA%\Programs\Python\Python313\python.exe" "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" "%LOCALAPPDATA%\Programs\Python\Python311\python.exe") do (
            if exist %%P (
              echo %%~P > python-path.txt
              goto found_python
            )
          )
          echo Installing portable Python in runner temporary directory
          set "PORTABLE=%RUNNER_TEMP%\town-python-3.11.9"
          if not exist "%PORTABLE%\python.exe" (
            curl.exe --fail --location --retry 3 https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip --output "%RUNNER_TEMP%\town-python.zip"
            if errorlevel 1 exit /b 1
            if not exist "%PORTABLE%" mkdir "%PORTABLE%"
            tar.exe -xf "%RUNNER_TEMP%\town-python.zip" -C "%PORTABLE%"
            if errorlevel 1 exit /b 1
          )
          "%PORTABLE%\python.exe" -c "import sys; print(sys.executable)" > python-path.txt
          if errorlevel 1 exit /b 1
          :found_python
          set /p PYTHON_EXE=<python-path.txt
          echo PYTHON_EXE=%PYTHON_EXE%>>"%GITHUB_ENV%"
          echo Using %PYTHON_EXE%
      - uses: actions/download-artifact@v4
        with:
          name: town-desktop-inputs
          path: build/town-desktop-inputs
      - name: Verify transferred fixture
        run: '"%PYTHON_EXE%" tools/verify_town_fixture.py'
      - name: Verify interactive desktop
        run: powershell.exe -NoProfile -NonInteractive -Command "if ((Get-Process -Id $PID).SessionId -eq 0 -or -not [Environment]::UserInteractive) { throw 'Visual runner must use an interactive desktop' }"
      - name: Compile and remap production mod and isolated test mod
        run: call gradlew.bat build remapTownProbe --no-daemon --console=plain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: MCA production client and framebuffer probe
        timeout-minutes: 15
        run: '"%PYTHON_EXE%" tools/run_town_runtime.py client'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-devhub-visual
          path: |
            build/town-runtime-evidence/
          if-no-files-found: warn
