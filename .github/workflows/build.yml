name: Build and sanity check

on:
  push:
    branches:
      - main
      - town-system-overhaul
      - town-hardening-pass
      - building-output-ui
      - dev
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build
        uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile and run unit tests
        run: ./gradlew build --stacktrace
      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f server-smoke.log
          timeout 120s ./gradlew runServer --args='nogui' > server-smoke.log 2>&1 &
          server_pid=$!
          started=0
          for i in {1..90}; do
            if grep -q 'Done (' server-smoke.log; then
              started=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          cat server-smoke.log
          test "$started" -eq 1
      - name: Headless client smoke test
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          rm -f client-smoke.log
          set +e
          ALSOFT_DRIVERS=null timeout 90s xvfb-run -a ./gradlew runClient > client-smoke.log 2>&1
          status=$?
          set -e
          cat client-smoke.log

          # runClient is expected to remain open until the timeout once the title screen is healthy.
          if [ "$status" -ne 124 ]; then
            echo "Client exited before the smoke-test timeout (status $status)."
            exit 1
          fi

          # Prove the client entrypoint and LWJGL/render bootstrap both ran.
          grep -q 'MCA Towns client initialized' client-smoke.log
          grep -q 'Backend library: LWJGL version' client-smoke.log

          # Catch common early client crashes even if Gradle itself stays alive briefly.
          if grep -Eqi 'Could not execute entrypoint|Exception in thread "Render thread"|Game crashed|ReportedException' client-smoke.log; then
            echo 'Client crash signature found in smoke-test log.'
            exit 1
          fi
