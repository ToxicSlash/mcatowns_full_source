name: Build and sanity check

on:
  push:
    branches:
      - main
      - town-system-overhaul
      - town-hardening-pass
      - building-output-ui
      - dev
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build
        uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile and run unit tests
        run: ./gradlew build --stacktrace
      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f server-smoke.log
          timeout 120s ./gradlew runServer --args='nogui' > server-smoke.log 2>&1 &
          server_pid=$!
          started=0
          for i in {1..90}; do
            if grep -q 'Done (' server-smoke.log; then
              started=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          cat server-smoke.log
          test "$started" -eq 1
